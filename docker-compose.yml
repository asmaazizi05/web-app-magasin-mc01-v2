services:
  postgres:
    image: postgres:16-alpine
    container_name: mc01-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mc01
      POSTGRES_PASSWORD: mc01
      POSTGRES_DB: mc01
    ports:
      - "5432:5432"
    volumes:
      - mc01-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mc01 -d mc01"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mc01-pgdata:
